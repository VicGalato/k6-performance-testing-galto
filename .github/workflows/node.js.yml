name: K6 Performance Testing

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  run-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup K6
        uses: grafana/setup-k6-action@v1

      - name: Run K6 Performance Test
        uses: grafana/run-k6-action@v1
        with:
          path: ./src/tests/Tests.spec.js